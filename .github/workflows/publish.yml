name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (for example, 0.8.0)'
        required: true
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Resolve target version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "target=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT -> target: $VERSION"

      - name: Update package version
        if: steps.version.outputs.current != steps.version.outputs.target
        env:
          VERSION: ${{ steps.version.outputs.target }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Verify package without publishing
        run: npm publish --access public --dry-run

      - name: Publish with npm Trusted Publisher
        run: npm publish --access public

      - name: Verify publication
        env:
          VERSION: ${{ steps.version.outputs.target }}
        run: |
          for attempt in 1 2 3 4 5; do
            PUBLISHED=$(npm view n8n-nodes-soniox-api version 2>/dev/null || true)
            echo "Registry version: $PUBLISHED; expected: $VERSION"
            if [ "$PUBLISHED" = "$VERSION" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::The npm registry did not expose version $VERSION in time"
          exit 1
